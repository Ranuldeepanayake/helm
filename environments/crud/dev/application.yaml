#ArgoCD application for the dev environment.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crud-dev #This becomes the release name.
  namespace: argocd
spec:
  project: home-lab
  source:
    repoURL: git@github.com:Ranuldeepanayake/helm.git
    targetRevision: develop
    path: charts/crud
    helm:
      valueFiles:
        - ../../environments/crud/dev/values.yaml
        - ../../environments/crud/dev/env.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: crud-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      syncOptions:
        - CreateNamespace=true
        - ApplyOutOfSyncOnly=false
        - Validate=false
        - Replace=false
        - Force=false
        - ServerSideApply=false