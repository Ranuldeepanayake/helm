#This is to override the chart name.
nameOverride: ""  #Overrides the chart name.
fullnameOverride: ""  #Overrides the fullname.

#Autoscaler.
replicaCount: 2 #Ignored when autoscaling is enabled.
autoscaling:
  enabled: true
  labels: {}
  annotations: {}
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 50
  targetMemoryUtilizationPercentage: 50

#Custom labels to be added to all resources. Can query resources by these labels. 
#These are different from selector labels since they are not used for selection.
commonLabels:
  environment: dev

#Add custom metadata to pods. These are different from labels since they are not used for selection.
#They are for informational purposes.
podAnnotations: {}

#Image pull secrets.
imagePullSecrets:
 - name: aws-ecr

#Deployment
deployment:
  labels: {}
  annotations: {}

#Containers.
containers:
  - name: app
    repository: nginx
    tag: stable
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: "125m"
        memory: "64Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"
    ports:
      - name: http
        containerPort: 80
        protocol: TCP
    volumeMounts: []
    # - name: foo
    #   mountPath: "/etc/foo"
    #   readOnly: true
    volumes: []
    # - name: foo
    #   secret:
    #     secretName: mysecret
    #     optional: false
    livenessProbe:
      httpGet:
        path: /
        port: http
      initialDelaySeconds: 15
      periodSeconds: 10          # Check every 10s
      timeoutSeconds: 3          # Give the request 5s to respond
      failureThreshold: 3        # Restart after 3 consecutive failures
      successThreshold: 1        # Consider healthy after 1 success
    readinessProbe:
      httpGet:
        path: /
        port: http
      initialDelaySeconds: 10    # Allow app some startup time
      periodSeconds: 5           # Check frequently to update readiness
      timeoutSeconds: 2
      failureThreshold: 2        # Mark not ready after 3 failures
      successThreshold: 1
    secrets: []
    configMapRef: [] #Referenced in the deployment eventhough empty here.
    env: []

#An empty env list is required importing .envs from value files by ArgoCD.
env: {}

#Services.
service:
  - name: api
    type: ClusterIP
    labels: {}
    annotations: {}
    ports:
      - name: api
        port: 80
        targetPort: 3000

#Ingresses.
ingress:
- name: api
  enabled: true
  ingressClassName: nginx
  labels: {}
  annotations: {}
  #nginx.ingress.kubernetes.io/rewrite-target: /$1
  #nginx.ingress.kubernetes.io/use-regex: "true"
  #nginx.ingress.kubernetes.io/ssl-redirect: "false"
  #nginx.ingress.kubernetes.io/proxy-body-size: "8m"
  hosts:
  - host: crud.mydomain.com
    paths:
      - path: /
        pathType: Prefix
        service:
          name: api
          port:
            number: 80
  tls: []
    # - hosts:
    #     - app.example.com
    #   secretName: app-tls

#Service accounts.
serviceAccount:
  create: true 
  name: crud
  labels: {}
  annotations: {}
  #Prevents mounting a kubenertes token at /var/run/secrets/kubernetes.io/serviceaccount/token in the container.
  #Therefore, even if RBAC permissions are accidentally granted, the application will not be able to access the Kubernetes API.
  automountServiceAccountToken: false 
# - name: worker-sa
#   annotations:
#     eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/my-api-role

#Role.
role:
  create: true
  name: crud
  labels: {}
  annotations: {}
  rules:
    - apiGroups: [""]
      resources: ["configmaps"]
      verbs: ["get", "list", "watch"]

#Role binding.
roleBinding:
  create: true
  name: crud
  labels: {}
  annotations: {}