apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qba-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Ranuldeepanayake/qba-helm.git
    targetRevision: develop
    path: charts/qba
    helm:
      valueFiles:
        - environments/dev/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: qba-dev
  # syncPolicy:
  #   automated:
  #     prune: true
  #     selfHeal: true