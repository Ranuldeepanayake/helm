apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qba-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Ranuldeepanayake/qba-helm.git
    targetRevision: develop
    path: charts/qba
    helm:
      valueFiles:
        - ../../environments/dev/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: qba-staging
  syncPolicy:
  #   automated:
  #     prune: true
  #     selfHeal: true
      syncOptions:
        - CreateNamespace=true
        - ApplyOutOfSyncOnly=false
        - Validate=false
        - Replace=false
        - Force=false
        - ServerSideApply=false