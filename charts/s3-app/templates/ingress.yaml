#Directs HTTP/HTTPS traffic into services.
{{- $root := . }}
{{- range $i, $ing := .Values.ingress }}
{{- if $ing.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $ing.name }}-{{ include "s3-app.fullname" $root }}
  labels:
  {{- include "s3-app.labels"  $root | nindent 4 }}
  {{- with  $root.Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $ing.labels }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ $ing.ingressClassName | default $root.Values.ingressClassName }}

  {{- with $ing.tls }}
  tls:
    {{- range . }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}

  rules:
    {{- range $ing.hosts }}
    - host: {{ .host }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path | quote }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ .service.name }}-{{ include "s3-app.fullname" $root }}
                port:
                  number: {{ .service.port.number }}
          {{- end }}
    {{- end }}
---
{{- end }}
{{- end }}
