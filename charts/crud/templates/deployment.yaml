apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "crud.fullname" . }}
  labels:
  {{- include "crud.labels" . | nindent 4 }}
  {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.deployment.labels }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.deployment.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  #These are labels to select which pods must come under a deployment. 
  #Selector labels must never be configurable. It is best to use the variables
  #provided by the chart. Selector labels are usually defined in the _helpers.tpl file and are used for selection purposes only.
  #The below items should not be used as selector labels,
  #environment, version, git SHA and optional Helm values etc.
  selector:
    matchLabels:
      {{- include "crud.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      #These are labels attached specifically to pods. They must include the selector labels plus additonal
      #labels for extra information.
      labels:
      {{- include "crud.labels" . | nindent 8 }} #labels include selector labels too in _helpers.tpl. #{{- include "crud.selectorLabels" . | nindent 8 }}
      {{- with .Values.commonLabels }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Values.serviceAccount.name }}-{{ include "crud.fullname" . }}
      {{- end }}

      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 30 }}

      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      #Init containers which run before main containers.
      {{- with .Values.initContainers }}
      initContainers:
      {{- range . }}
      - name: {{ .name }}
        image: {{ .image }}
        {{- with .resources }}
        resources:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- with .env }}
        env:
        {{- range . }}
          - name: {{ .name }}
            value: {{ .value | quote }}
        {{- end }}
        {{- end }}
        {{- with .command }}
        command:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- with .args }}
        args:
          {{- toYaml . | nindent 12 }}
        {{- end }}
      {{- end }}
      {{- end }}

      #Main containers.
      containers:
      {{- range .Values.containers }}
      - name: {{ .name }}
        image: "{{ .repository }}:{{ .tag }}"
        imagePullPolicy: {{ .imagePullPolicy }}

        {{- with .resources }}
        resources:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        
        {{- with .ports }}
        ports:
        {{- range . }}
          - name: {{ .name }}
            containerPort: {{ .containerPort }}
            protocol: {{ .protocol }}
        {{- end }}
        {{- end }}

        {{- with .volumeMounts }}
        volumeMounts:
          {{- toYaml . | nindent 12 }}
        {{- end }}

        {{- with .livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 12 }}
        {{- end }}

        {{- with .readinessProbe }}
        readinessProbe:
          {{- toYaml . | nindent 12 }}
        {{- end }}

        {{- with .securityContext }}
        securityContext:
        {{- toYaml . | nindent 12 }}
        {{- end }}

        {{- with .env }}
        env:
        {{- range . }}
          - name: {{ .name }}
            value: {{ .value | quote }}
        {{- end }}
        {{- end }}
        #This is for referencing the config map for environment variables. 
        #It is optional and will not cause any issues if the config map is not present.
        #A conditional include is not set since there will be one config map per container.
        #The config map will be generated with the name <container-name>-<release-name>.
        envFrom:
          - configMapRef:
              name: {{ .name }}-{{ include "crud.fullname" $ }}
              optional: true

        {{- with .command }}
        command:
          {{- toYaml . | nindent 12 }}
        {{- end }}

        {{- with .args }}
        args:
          {{- toYaml . | nindent 12 }}
        {{- end }}

      {{- end }}
      #Volumes live at the same level as containers in the pod spec. They are referenced in the container spec as volumeMounts.
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 12 }}
      {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      
