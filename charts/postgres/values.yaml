#Installation instructions,
#helm repo add bitnami https://charts.bitnami.com/bitnami
#helm repo update
#helm install postgres bitnami/postgresql -f values.yaml
#or
#helm upgrade --install postgres bitnami/postgresql -f values.yaml

auth:
  username: appuser
  password: supersecurepassword
  database: appdb

primary:
  persistence:
    enabled: true
    storageClass: local-path
    size: 1Gi

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

service:
  type: LoadBalancer
  ports:
    postgresql: 5432


