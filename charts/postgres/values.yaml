#Installation instructions,
#helm repo add bitnami https://charts.bitnami.com/bitnami
#helm repo update
#helm install postgres bitnami/postgresql -f values.yaml
#or
#helm upgrade --install postgres bitnami/postgresql -f values.yaml
#Endpoint: <service-name>.<namespace>.svc.cluster.local:5432

#If high availability is needed.
#architecture: replication
architecture: standalone

primary:
  persistence:
    enabled: true
    storageClass: local-path
    size: 1Gi
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  service:
    type: LoadBalancer
    loadBalancerIP: 192.168.56.200
    ports:
      postgresql: 5432
